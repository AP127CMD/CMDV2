name = "ap127-watchdog"
main = "src/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
# */2 (was */5): the cron is now a backstop — a Pi/CI publish push-triggers a
# run immediately via POST /notify. Per-invocation CPU is unchanged (reads the
# small flight-data-recent.js, short-circuits on unchanged extractFeedSig).
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "KV"
id = "b42f3202c5364f91aef3837132d6ccd5"
preview_id = "b42f3202c5364f91aef3837132d6ccd5"
